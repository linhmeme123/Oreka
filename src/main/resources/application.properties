spring.application.name=tktt

# Chạy một phiên bản ứng dụng trên máy cá nhân.
server.address=127.0.0.1
server.port=8080

# Lucene lưu dữ liệu trên đĩa, không cần PostgreSQL.
app.index-directory=data/index
app.python=.venv/bin/python
app.crawler-script=crawler/hust_spider.py
# Thêm miền con bằng dấu phẩy; chỉ cho phép hust.edu.vn và *.hust.edu.vn.
app.seed-urls=https://hust.edu.vn/,https://hust.edu.vn/vi/news/
app.max-pages=100
app.max-depth=3
app.download-delay-seconds=1
app.max-file-mb=10
app.crawl-timeout-seconds=1800
# Quét sau 6 giờ kể từ lúc khởi động, rồi mỗi 6 giờ. Có thể bấm nút để quét ngay.
app.crawl-interval-ms=21600000

management.endpoints.web.exposure.include=health
